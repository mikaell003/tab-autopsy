<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tab Autopsy — Settings</title>
<link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="page">
    <header>
      <span class="glyph">†</span>
      <h1>Tab Autopsy settings</h1>
    </header>

    <section class="field">
      <label for="idleMinutes">Bury a tab after it's been idle for</label>
      <select id="idleMinutes">
        <option value="10">10 minutes</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">1 hour</option>
        <option value="120">2 hours</option>
        <option value="240">4 hours</option>
      </select>
      <p class="hint">The tab you're actively looking at is never buried, no matter how long it's open.</p>
    </section>

    <section class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="ignorePinned" />
        Never bury pinned tabs
      </label>
    </section>

    <section class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="autoPurgeEnabled" />
        Auto-delete graveyard entries after
      </label>
      <select id="autoPurgeDays">
        <option value="7">7 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="365">1 year</option>
      </select>
      <p class="hint">Deleted entries can't be searched or restored. Turn this off to keep everything indefinitely.</p>
    </section>

    <section class="field">
      <label for="excludedDomains">Never bury tabs from these domains</label>
      <textarea id="excludedDomains" rows="4" placeholder="one per line, e.g.&#10;mail.google.com&#10;docs.google.com"></textarea>
    </section>

    <div class="actions">
      <button id="save" class="btn-primary">Save changes</button>
      <span id="savedNote" class="saved-note"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
